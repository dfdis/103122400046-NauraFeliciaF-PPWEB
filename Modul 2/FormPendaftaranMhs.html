<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran Mahasiswa</title>
</head>
<body>

    <h2>Form Pendaftaran Mahasiswa</h2>

    <form action="#" method="POST">
        <div>
            <label for="nama">Nama Lengkap:</label><br>
            <input type="text" id="nama" name="nama" required>
        </div>
        <br>

        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>
        </div>
        <br>

        <div>
            <label>Jenis Kelamin:</label><br>
            <input type="radio" id="gender_l" name="jenis_kelamin" value="Laki-laki">
            <label for="gender_l">Laki-laki</label><br>
            <input type="radio" id="gender_p" name="jenis_kelamin" value="Perempuan">
            <label for="gender_p">Perempuan</label>
        </div>
        <br>

        <div>
            <label>Hobi:</label><br>
            <input type="checkbox" id="hobi_membaca" name="hobi[]" value="Membaca">
            <label for="hobi_membaca">Membaca</label><br>
            <input type="checkbox" id="hobi_olahraga" name="hobi[]" value="Olahraga">
            <label for="hobi_olahraga">Olahraga</label><br>
            <input type="checkbox" id="hobi_musik" name="hobi[]" value="Musik">
            <label for="hobi_musik">Musik</label>
        </div>
        <br>

        <div>
            <label for="pendidikan">Pendidikan Terakhir:</label><br>
            <select id="pendidikan" name="pendidikan">
                <option value="">-- Pilih Pendidikan --</option>
                <option value="SMA/SMK">SMA/SMK</option>
                <option value="D3">D3</option>
                <option value="S1">S1</option>
            </select>
        </div>
        <br>

        <div>
            <label for="kritik_saran">Kritik dan Saran:</label><br>
            <textarea id="kritik_saran" name="kritik_saran" rows="4" cols="50"></textarea>
        </div>
        <br>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>

</body>
</html>
